server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: lakecloud-ai
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5433/lakecloud_ai}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6380}
    database: ${REDIS_DB:0}
    timeout: ${REDIS_TIMEOUT:3000}
    password: ${REDIS_PASSWORD:}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.lakecloud.ai.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

ai:
  wuxidata:
    app-id: ${WUXIDATA_APP_ID:}
    app-key: ${WUXIDATA_APP_KEY:}
    base-url: ${WUXIDATA_BASE_URL:https://glai2.wuxidata.com.cn:9000}
    model: ${WUXIDATA_MODEL:/model/Qwen3-Next}
    timeout: ${WUXIDATA_TIMEOUT:60000}
    trust-all-ssl: ${WUXIDATA_TRUST_ALL_SSL:false}
  voice:
    base-url: ${VOICE_BASE_URL:http://192.168.20.235:9100}
    model: ${VOICE_MODEL:/model}
    timeout: ${VOICE_TIMEOUT:60000}
    trust-all-ssl: ${VOICE_TRUST_ALL_SSL:false}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    com.lakecloud.ai: debug
